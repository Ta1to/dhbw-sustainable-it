services:
  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    ports:
      - "9091:9091"
    restart: unless-stopped

  prometheus:
    build:
      context: .
      dockerfile: prometheus.Dockerfile
    container_name: prometheus
    ports:
      - "9090:9090"
    depends_on:
      - pushgateway
    restart: unless-stopped

  svelte-server:
    build:
      context: ..
      dockerfile: benchmark/svelte-server/Dockerfile
    container_name: svelte-server
    ports:
      - "5173:5173"
    restart: unless-stopped