services:
  # ── Pushgateway (empfängt Metriken von Scaphandre Windows-Service) ──
  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    ports:
      - "9091:9091"
    restart: unless-stopped

  # ── Prometheus ──
  prometheus:
    build:
      context: .
      dockerfile: prometheus.Dockerfile
    container_name: prometheus
    ports:
      - "9090:9090"
    depends_on:
      - pushgateway
    restart: unless-stopped

  # ── Grafana ──
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── Astro Server ──
  astro-server:
    build:
      context: ..
      dockerfile: benchmark/astro-server/Dockerfile
    container_name: astro-server
    ports:
      - "4321:4321"
    restart: unless-stopped

  # ── Next Server ──
  next-server:
    build:
      context: ..
      dockerfile: benchmark/next-server/Dockerfile
    container_name: next-server
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ── Svelte Server ──
  svelte-server:
    build:
      context: ..
      dockerfile: benchmark/svelte-server/Dockerfile
    container_name: svelte-server
    ports:
      - "5173:5173"
    restart: unless-stopped